<!DOCTYPE html>
<html>
    <head>
        <title>Charades</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Screen 1: entrance -->
        <div id="entrance-screen" class="screen card">
            <h1>AI Charades</h1>
            <input id="username-input" placeholder="Your name">
            <br><br>
            <button id="create-btn">Create lobby</button>
            <p>or</p>
            <input id="code-input" placeholder="Lobby code">
            <button id="join-btn">Join lobby</button>
        </div>


        <!-- Screen 2: lobby -->
        <div id="lobby-screen" class="screen card hidden">
            <h2>Lobby code: <span id="lobby-code"></span></h2>
            <p>Waiting for players...</p>
            <button id="start-btn">Start game</button>
        </div>


        <!-- Screen 3: game -->
        <div id="game-screen" class="screen hidden">
            <div class="game-layout">
                <div class="team card">
                    <h2>Team 1</h2>
                    <p id="score1">Score: 0</p>
                    <p>Paul</p>
                    <p>Wayne</p>
                </div>
                <div class="stage card">
                    <p id="turn"></p>
                    <p id="timer">Time: 30</p>
                    <video id="clip" controls></video>
                    <p id="hint"></p>
                    <button id="play-btn">Play a random clip</button>
                    <br><br>
                    <input id="guess-input" placeholder="Your guess">
                    <button id="guess-btn">Guess</button>
                    <p id="result"></p>
                </div>
                <div class="team card">
                    <h2>Team 2</h2>
                    <p id="score2">Score: 0</p>
                    <p>Alex</p>
                    <p>Sam</p>
                </div>
            </div>
        </div>


        <script src="/socket.io/socket.io.js"></script>
        <script src="script.js"></script>
    </body>
</html>
